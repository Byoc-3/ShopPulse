<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopPulse - Checkout</title>
  <link rel="stylesheet" href="cart.css">
  <link rel="stylesheet" href="checkout.css">
</head>
<body>

  <!-- Same navbar as cart.html for consistency -->
  <nav class="navbar">
    <div class="logo">LUXE.</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">Categories</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
    <div class="cart-icon">
      🛒 <span class="cart-count" id="cartCount">0</span>
    </div>
  </nav>

  <div class="checkout-container">

    <!-- LEFT: Customer Information Form -->
    <div class="customer-info">
      <h2>CUSTOMER INFORMATION</h2>

      <label>Full Name <span class="required">*</span></label>
      <input type="text" id="fullName" placeholder="e.g. Amara Okafor">

      <label>Email Address <span class="required">*</span></label>
      <input type="email" id="email" placeholder="e.g. amaraokafor@gmail.com">

      <label>Phone Number <span class="required">*</span></label>
      <input type="tel" id="phone" placeholder="e.g. 08123456789">

      <label>Address <span class="required">*</span></label>
      <textarea id="address" placeholder="e.g. 12 Banana Island Road, Ikoyi, Lagos, Nigeria"></textarea>

      <button class="place-order-btn" id="placeOrderBtn">PLACE ORDER</button>
    </div>

    <!-- RIGHT: Order Summary -->
    <div class="order-summary">
      <h2>ORDER SUMMARY</h2>
      <div id="orderItemsContainer">
        <!-- Order items will be inserted here by JavaScript -->
      </div>

      <div class="summary-row">
        <span>Subtotal</span>
        <span id="checkoutSubtotal">₦0</span>
      </div>
      <div class="summary-row">
        <span>Delivery</span>
        <span id="checkoutDelivery">₦5,000</span>
      </div>
      <div class="summary-row total-row">
        <span>TOTAL</span>
        <span id="checkoutTotal">₦0</span>
      </div>
    </div>

  </div>

  <script src="checkout.js"></script>
</body>
</html>
