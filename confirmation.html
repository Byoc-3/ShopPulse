<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopPulse - Order Confirmed</title>
  <link rel="stylesheet" href="cart.css">
  <link rel="stylesheet" href="confirmation.css">
</head>
<body>

  <!-- Same navbar for consistency -->
  <nav class="navbar">
    <div class="logo">LUXE.</div>
    <div class="nav-links">
      <a href="#">Home</a>
      <a href="#">Shop</a>
      <a href="#">Categories</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
    <div class="cart-icon">
      🛒 <span class="cart-count">0</span>
    </div>
  </nav>

  <div class="confirmation-container">
    <div class="checkmark-circle">
      <span class="checkmark">&#10003;</span>
    </div>

    <h1>Order Placed Successfully!</h1>
    <p class="sub-text">Thank you for shopping with LUXE. Your order is being processed.</p>

    <div class="receipt-box">
      <div class="receipt-row">
        <span>Order Number</span>
        <span id="orderNumber">-</span>
      </div>
      <div class="receipt-row">
        <span>Total Paid</span>
        <span id="orderTotal">-</span>
      </div>
      <div class="receipt-row">
        <span>Estimated Delivery</span>
        <span id="deliveryDate">-</span>
      </div>
    </div>

    <a href="index.html" class="back-home-btn">CONTINUE SHOPPING</a>
  </div>

  <script src="confirmation.js"></script>
</body>
</html>
