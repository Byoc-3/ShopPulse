<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopPulse | Login</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="site-header">
        <nav class="navbar">
            <a href="../index.html" class="logo">ShopPulse.</a>

            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="shop.html#categories">Categories</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <button class="icon-button" aria-label="Search">🔍</button>
                <a href="shop.html" class="cart-icon">
                    🛒
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- ================= LOGIN ================= -->
    <main class="auth-page">

        <div class="auth-container">

            <p class="section-label">WELCOME BACK</p>
            <h1>Log In</h1>
            <p class="auth-subtext">Enter your details to access your account.</p>

            <form id="login-form" novalidate>

                <div class="form-group">
                    <label for="login-email">Email Address <span>*</span></label>
                    <input type="email" id="login-email" placeholder="example@email.com" required>
                    <small class="error-message" id="login-email-error"></small>
                </div>

                <div class="form-group">
                    <label for="login-password">Password <span>*</span></label>
                    <input type="password" id="login-password" placeholder="Enter your password" required>
                    <small class="error-message" id="login-password-error"></small>
                </div>

                <button type="submit" class="primary-button">Log In</button>

            </form>

            <p class="auth-switch">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="site-footer">
        <div class="footer-bottom">
            <p>© 2026 ShopPulse. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/auth.js"></script>

</body>

</html>
