<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopPulse | Sign Up</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header class="site-header">
        <nav class="navbar">
            <a href="../index.html" class="logo">ShopPulse.</a>

            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="shop.html#categories">Categories</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>

            <div class="nav-actions">
                <button class="icon-button" aria-label="Search">🔍</button>
                <a href="shop.html" class="cart-icon">
                    🛒
                    <span class="cart-count" id="cart-count">0</span>
                </a>
            </div>
        </nav>
    </header>

    <!-- ================= SIGNUP ================= -->
    <main class="auth-page">

        <div class="auth-container">

            <p class="section-label">JOIN SHOPPULSE</p>
            <h1>Create Account</h1>
            <p class="auth-subtext">Sign up to start shopping with us.</p>

            <form id="signup-form" novalidate>

                <div class="form-group">
                    <label for="signup-name">Full Name <span>*</span></label>
                    <input type="text" id="signup-name" placeholder="Enter your full name" required>
                    <small class="error-message" id="signup-name-error"></small>
                </div>

                <div class="form-group">
                    <label for="signup-email">Email Address <span>*</span></label>
                    <input type="email" id="signup-email" placeholder="example@email.com" required>
                    <small class="error-message" id="signup-email-error"></small>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password <span>*</span></label>
                    <input type="password" id="signup-password" placeholder="Create a password" required>
                    <small class="error-message" id="signup-password-error"></small>
                </div>

                <div class="form-group">
                    <label for="signup-confirm-password">Confirm Password <span>*</span></label>
                    <input type="password" id="signup-confirm-password" placeholder="Re-enter your password" required>
                    <small class="error-message" id="signup-confirm-password-error"></small>
                </div>

                <button type="submit" class="primary-button">Sign Up</button>

            </form>

            <p class="auth-switch">
                Already have an account? <a href="login.html">Log In</a>
            </p>

        </div>

    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="site-footer">
        <div class="footer-bottom">
            <p>© 2026 ShopPulse. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/auth.js"></script>

</body>

</html>
